name: Feature Request
description: File a feature request.
title: "[FR]: "
labels: ["enhancement"]
assignees:
 - akuqt
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: question-1
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: question-2
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Ex. I'm want to [...]
    validations:
      required: true
  - type: textarea
    id: question-3
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Ex. I have considered [...]
    validations:
      required: true
  - type: textarea
    id: question-4
    attributes:
      label: Additional context
      description: Add any other context about the feature request here.
      placeholder: Ex. Need to add [...]
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/Akuqt/iot-lab-gen/blob/94dcaa5f2284b2539ca4ad0d82e739422bee9b2a/CODE_OF_CONDUCT.md). 
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true